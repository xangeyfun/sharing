<!DOCTYPE html>
<html lang="en">
<head>

    <title>Share unavailable</title>
    <link rel="icon" type="image/png" href="https://xangey.dev/static/Images/favicon.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
</head>
<body>
    <main class="public-page">
        <div class="public-card">
            <header class="public-header">

                <h1>Share unavailable</h1>
                <p>This link is no longer active. The share may have expired, reached its download limit, or been removed by the owner.</p>
            </div>

            <footer class="public-footer">Hosted by xangey.dev</footer>
        </div>

</html>
